name: Update Brasov News

on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'

permissions:
  contents: write

concurrency:
  group: brasov-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Brasov news
        run: python update_news.py

      - name: Save updated news
        run: |
          git config user.name "brasov-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git commit -m "Update Brasov news"
          git pull --rebase origin main
          git push origin main
