name: Update Brasov News

on:
  workflow_dispatch:
  schedule:
    - cron: '5 4,9,14,18 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Brasov news
        run: python update_news.py

      - name: Save updated news
        run: |
          git config user.name "brasov-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update Brasov News"
          git push
