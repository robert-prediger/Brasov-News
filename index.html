<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brașov News">
<link rel="apple-touch-icon" href="apple-touch-icon.PNG">
<title>Brașov News</title>
<style>
:root{--bg:#08101d;--card:#111c2d;--text:#f5f7fb;--muted:#9eabc0;--blue:#68afff;--line:#273750}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(#08101d,#0c1626);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.w{max-width:780px;margin:auto;padding:30px 16px 55px}.brand{letter-spacing:.18em;color:#80bcff;font-weight:800}.h{font-size:38px;margin:8px 0}.muted{color:var(--muted)}.status{color:#9de8b1;margin:14px 0}
.card{background:#111c2d;border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0}.card h2{margin:0 0 12px}.story{border-top:1px solid var(--line);padding:15px 0}.story:first-child{border:0}.meta{font-size:12px;color:#91a5c1}.story h3{font-size:18px;line-height:1.3;margin:6px 0 9px}.story a{color:var(--blue);font-weight:700;text-decoration:none}
.filter{display:flex;gap:7px;overflow:auto;margin:14px 0}.filter button{white-space:nowrap;border:1px solid var(--line);background:#16243a;color:#eaf1fb;padding:9px 12px;border-radius:999px}
.search-wrap{position:relative;margin:16px 0 10px}.search{width:100%;border:1px solid var(--line);background:#111c2d;color:var(--text);font-size:16px;padding:14px 46px 14px 44px;border-radius:16px;outline:none}.search::placeholder{color:#7889a3}.search:focus{border-color:#68afff}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#9eabc0;font-size:20px;padding:6px 10px;display:none}
.brief{line-height:1.55}.brief ul{margin:0;padding-left:22px}.brief li{margin:0 0 12px}.brief li:last-child{margin-bottom:0}.brief a{color:var(--text);text-decoration:none;font-weight:650}.count{font-size:13px;color:#9eabc0} footer{text-align:center;color:#72819a;font-size:12px;margin-top:28px}
</style></head><body><main class="w">
<div class="brand">BRAȘOV NEWS</div><h1 class="h">Daily Brief</h1><div class="muted" id="date"></div><div class="status" id="status">● Se încarcă…</div>
<section class="card"><h2>⚡ Brașov în 60 de secunde</h2><div class="brief" id="brief"></div></section>
<div class="search-wrap"><span class="search-icon">🔍</span><input type="search" id="search" class="search" placeholder="Caută în știrile de azi…" autocomplete="off"><button class="search-clear" id="searchClear" aria-label="Șterge căutarea">×</button></div>
<div class="filter" id="filters"></div><section class="card"><h2>📰 Toate știrile de azi</h2><div class="count" id="count"></div><div id="list"></div></section>
<footer>Selecție automată din publicații locale • Link direct către sursa originală</footer></main>
<script>
let DATA=[]; let ACTIVE_CATEGORY="Toate"; let LAST_UPDATED=null; let SEARCH_QUERY="";
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function updateDate(){document.getElementById("date").textContent=new Date().toLocaleDateString("ro-RO",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" • Știrile care contează. Fără zgomot.";}

function normalizeTitle(title){
 return String(title||"")
   .toLocaleLowerCase("ro-RO")
   .normalize("NFD")
   .replace(/[\u0300-\u036f]/g,"")
   .replace(/[^a-z0-9\s-]/g," ")
   .replace(/\s+/g," ")
   .trim();
}

function titleWords(title){
 const stop=new Set([
   "a","ai","ale","al","au","ca","care","ce","cea","cei","cel","cele",
   "cu","cum","de","din","dupa","este","fost","in","la","mai","o","pe",
   "pentru","prin","s","sa","se","si","sunt","un","una","unei","unui",
   "update","brasov","stire","stiri"
 ]);

 /* Forme diferite care descriu aceeași idee sunt aduse la un termen comun. */
 const aliases={
   "spitalul":"spital","spitalului":"spital",
   "marzescu":"marzescu",
   "incendiul":"incendiu",
   "decedat":"deces","decedata":"deces","decedata":"deces",
   "murit":"deces","moarta":"deces","moarte":"deces",
   "femeie":"persoana","tanara":"persoana",
   "pacienti":"pacient","evacuati":"evacuare","evacuat":"evacuare",
   "victorie":"castig","victoria":"castig","invins":"castig",
   "steaua":"steaua","rosie":"rosie",
   "fagaras":"fagaras","muntii":"munte","muntele":"munte",
   "cazut":"cadere","cadere":"cadere"
 };

 return [...new Set(
   normalizeTitle(title)
     .split(/\s+/)
     .filter(w=>w.length>=3 && !stop.has(w))
     .map(w=>aliases[w]||w)
 )];
}

function hasAny(set,words){
 return words.some(w=>set.has(w));
}

/*
  Detectează aceeași POVESTE, nu doar titluri aproape identice.
  Folosește:
  1. suprapunerea de cuvinte;
  2. combinații de ancore pentru evenimente locale;
  3. nume/locuri distinctive.
*/
function sameTopic(a,b){
 const A=new Set(titleWords(a));
 const B=new Set(titleWords(b));
 if(!A.size || !B.size) return false;

 const common=[...A].filter(w=>B.has(w));
 const smaller=Math.min(A.size,B.size);
 const union=new Set([...A,...B]).size;
 const containment=common.length/smaller;
 const jaccard=common.length/union;

 /* Titluri lexical foarte apropiate. */
 if(common.length>=4 && containment>=0.45) return true;
 if(common.length>=3 && jaccard>=0.30) return true;

 /* Incendiul de la Spitalul Mârzescu – formulările pot fi foarte diferite. */
 const fireA=A.has("incendiu"), fireB=B.has("incendiu");
 const hospitalA=A.has("spital")||A.has("marzescu");
 const hospitalB=B.has("spital")||B.has("marzescu");
 if(fireA && fireB && hospitalA && hospitalB) return true;

 /* Dacă ambele menționează Mârzescu plus un indiciu de incident, sunt același subiect. */
 if(A.has("marzescu") && B.has("marzescu") &&
    (hasAny(A,["incendiu","deces","evacuare"]) &&
     hasAny(B,["incendiu","deces","evacuare"]))) return true;

 /* Același meci Corona – Steaua Roșie. */
 if(A.has("corona") && B.has("corona") &&
    A.has("steaua") && B.has("steaua") &&
    A.has("rosie") && B.has("rosie")) return true;

 /* Același accident/cădere într-un loc distinctiv. */
 if(A.has("fagaras") && B.has("fagaras") &&
    hasAny(A,["cadere","accident"]) &&
    hasAny(B,["cadere","accident"])) return true;

 /* Nume/loc foarte distinctiv + încă două idei comune. */
 const distinctive=["marzescu","corona","fagaras"];
 const sharedDistinctive=distinctive.some(w=>A.has(w)&&B.has(w));
 if(sharedDistinctive && common.length>=3) return true;

 return false;
}

function getBriefItems(items,limit=5){
 const chosen=[];

 /* Caută prin toată lista până găsește 5 evenimente distincte. */
 for(const item of items){
   if(!item || !item.title) continue;

   const duplicate=chosen.some(existing=>
     sameTopic(item.title,existing.title)
   );

   if(!duplicate) chosen.push(item);
   if(chosen.length>=limit) break;
 }

 return chosen;
}

function draw(cat=ACTIVE_CATEGORY){
 ACTIVE_CATEGORY=cat; let a=cat==="Toate"?DATA:DATA.filter(x=>x.category===cat);
 if(SEARCH_QUERY){const q=SEARCH_QUERY.toLocaleLowerCase("ro-RO");a=a.filter(x=>String(x.title||"").toLocaleLowerCase("ro-RO").includes(q)||String(x.source||"").toLocaleLowerCase("ro-RO").includes(q)||String(x.category||"").toLocaleLowerCase("ro-RO").includes(q));}
 document.getElementById("count").textContent=SEARCH_QUERY?a.length+" rezultate găsite":a.length+" articole locale";
 document.getElementById("list").innerHTML=a.map(x=>`<article class="story"><div class="meta">${E(x.category)} • ${E(x.source)}</div><h3>${E(x.title)}</h3><a target="_blank" rel="noopener" href="${x.url}">Citește articolul original →</a></article>`).join("")||`<p class="muted">${SEARCH_QUERY?"Nu am găsit nicio știre pentru această căutare.":"Nicio știre în această categorie."}</p>`;
}
function render(x){
 DATA=x.items||[];LAST_UPDATED=x.updated||null;document.getElementById("status").textContent="● Ultima actualizare: "+(x.updated||"necunoscută");
 const briefItems=getBriefItems(DATA,5);
 document.getElementById("brief").innerHTML=briefItems.length?`<ul>${briefItems.map(v=>`<li><a target="_blank" rel="noopener" href="${v.url}">${E(v.title)}</a></li>`).join("")}</ul>`:"Nu sunt încă știri disponibile.";
 let cats=["Toate",...new Set(DATA.map(x=>x.category))];if(!cats.includes(ACTIVE_CATEGORY))ACTIVE_CATEGORY="Toate";
 document.getElementById("filters").innerHTML=cats.map(c=>`<button data-cat="${E(c)}">${E(c)}</button>`).join("");
 document.querySelectorAll("#filters button").forEach(b=>b.addEventListener("click",()=>draw(b.dataset.cat)));draw(ACTIVE_CATEGORY);
}
const searchInput=document.getElementById("search"),searchClear=document.getElementById("searchClear");
searchInput.addEventListener("input",()=>{SEARCH_QUERY=searchInput.value.trim();searchClear.style.display=SEARCH_QUERY?"block":"none";draw(ACTIVE_CATEGORY);});
searchClear.addEventListener("click",()=>{searchInput.value="";SEARCH_QUERY="";searchClear.style.display="none";searchInput.focus();draw(ACTIVE_CATEGORY);});
async function loadNews(showLoading=false){
 if(showLoading&&!DATA.length)document.getElementById("status").textContent="● Se încarcă…";
 try{const r=await fetch("news.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const x=await r.json();if(!LAST_UPDATED||x.updated!==LAST_UPDATED)render(x);else document.getElementById("status").textContent="● Ultima actualizare: "+x.updated;}
 catch(e){if(!DATA.length)document.getElementById("status").textContent="● Nu s-a putut verifica actualizarea";}
}
updateDate();loadNews(true);
setInterval(()=>{if(!document.hidden)loadNews(false);},5*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){updateDate();loadNews(false);}});
window.addEventListener("pageshow",()=>{updateDate();loadNews(false);});
window.addEventListener("focus",()=>{loadNews(false);});
</script></body></html>
