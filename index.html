<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101d"><title>Brașov News</title><style>
:root{--bg:#08101d;--card:#111c2d;--text:#f5f7fb;--muted:#9eabc0;--blue:#68afff;--line:#273750}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#08101d,#0c1626);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:780px;margin:auto;padding:30px 16px 55px}.brand{letter-spacing:.18em;color:#80bcff;font-weight:800}.h{font-size:38px;margin:8px 0}.muted{color:var(--muted)}.status{color:#9de8b1;margin:14px 0}.card{background:#111c2d;border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0}.card h2{margin:0 0 12px}.story{border-top:1px solid var(--line);padding:15px 0}.story:first-child{border:0}.meta{font-size:12px;color:#91a5c1}.story h3{font-size:18px;line-height:1.3;margin:6px 0 9px}.story a{color:var(--blue);font-weight:700;text-decoration:none}.filter{display:flex;gap:7px;overflow:auto;margin:14px 0}.filter button{white-space:nowrap;border:1px solid var(--line);background:#16243a;color:#eaf1fb;padding:9px 12px;border-radius:999px}.brief{line-height:1.55}.count{font-size:13px;color:#9eabc0}footer{text-align:center;color:#72819a;font-size:12px;margin-top:28px}</style></head><body><main class="w"><div class="brand">BRAȘOV NEWS</div><h1 class="h">Daily Brief</h1><div class="muted" id="date"></div><div class="status" id="status">● Se încarcă…</div><section class="card"><h2>⚡ Brașov în 60 de secunde</h2><div class="brief" id="brief"></div></section><div class="filter" id="filters"></div><section class="card"><h2>📰 Toate știrile de azi</h2><div class="count" id="count"></div><div id="list"></div></section><footer>Selecție automată din publicații locale • Link direct către sursa originală</footer></main><script>
let DATA=[]; const E=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("date").textContent=new Date().toLocaleDateString("ro-RO",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" • Știrile care contează. Fără zgomot.";
function draw(cat="Toate"){let a=cat==="Toate"?DATA:DATA.filter(x=>x.category===cat);document.getElementById("count").textContent=a.length+" articole locale";document.getElementById("list").innerHTML=a.map(x=>`<article class="story"><div class="meta">${x.category} • ${E(x.source)}</div><h3>${E(x.title)}</h3><a target="_blank" rel="noopener" href="${x.url}">Citește articolul original →</a></article>`).join("")||'<p class="muted">Nicio știre în această categorie.</p>'}
fetch("news.json?"+Date.now()).then(r=>r.json()).then(x=>{DATA=x.items||[];document.getElementById("status").textContent="● Ultima actualizare: "+x.updated;document.getElementById("brief").textContent=DATA.length?"Cele mai urmărite subiecte locale: "+DATA.slice(0,5).map(v=>v.title).join(" • ")+".":"Nu sunt încă știri disponibile.";let cats=["Toate",...new Set(DATA.map(x=>x.category))];document.getElementById("filters").innerHTML=cats.map(c=>`<button onclick='draw(${JSON.stringify(c)})'>${c}</button>`).join("");draw()}).catch(()=>document.getElementById("status").textContent="● Așteaptă prima actualizare automată");
</script></body></html>
